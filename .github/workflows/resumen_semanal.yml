# Resumen semanal de BiGlobal
# Cada lunes a las 8:00 a. m. (hora de Colombia = 13:00 UTC) llama a la
# tarea del sitio, que arma el resumen y lo manda a la campana y al correo.
#
# Requisito: en GitHub → Settings → Secrets and variables → Actions,
# crear el secreto TAREAS_TOKEN con el MISMO valor que la variable
# TAREAS_TOKEN de Render.
#
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").

name: Resumen semanal

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a la tarea del resumen
        env:
          TAREAS_TOKEN: ${{ secrets.TAREAS_TOKEN }}
        run: |
          # El plan gratis de Render se duerme: el primer intento puede tardar en despertar
          curl --fail-with-body --silent --show-error \
               --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
               -X POST \
               -H "X-Tarea-Token: ${TAREAS_TOKEN}" \
               https://biglobal.onrender.com/tareas/resumen_semanal.php
